# SD Turbo LoRA Training Config
# Constitutional procedural texture generation

model:
  name: "stabilityai/sd-turbo"
  dtype: "float16"
  revision: "main"
  variant: "fp16"

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "checkpoints/sd_turbo_lora"
  num_train_epochs: 100
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 100
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  mixed_precision: "fp16"
  use_8bit_adam: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  seed: 42
  
  # Constitutional settings
  deterministic: true
  replay_token_seed: 42
  save_every_n_steps: 500
  eval_every_n_steps: 100
  log_every_n_steps: 10

data:
  train_data: "data/processed/shader_texture_train.jsonl"
  val_data: "data/processed/shader_texture_val.jsonl"
  max_length: 256
  image_size: 512
  center_crop: true
  random_flip: false  # Deterministic for constitutional replay

categories:
  - "procedural_materials"
  - "natural_surfaces"
  - "metal_industrial"
  - "sci_fi_futuristic"
  - "liquids"
  - "water_fluids"
  - "abstract_math"

validation:
  prompts:
    - "frosted glass microflake BRDF with iridescent thin-film interference"
    - "ocean waves Gerstner with foam generation"
    - "hologram shader with scanlines and flicker"
    - "rust growth simulation on brushed aluminum"
    - "crystalline quartz with internal cracks"
  num_inference_steps: 4
  guidance_scale: 0.0
  seed: 42

constitutional:
  replay_validation: true
  rt4d_check: true
  deterministic_output: true
  metadata_embed: true
  trace_export: true

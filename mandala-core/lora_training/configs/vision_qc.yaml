# Vision QC LoRA Training Config
# Artifact detection + quality control for constitutional rendering

model:
  name: "google/vit-base-patch16-224"
  dtype: "float16"
  num_labels: 10
  label2id:
    "clean": 0
    "noise": 1
    "banding": 2
    "aliasing": 3
    "flicker": 4
    "ghosting": 5
    "blur": 6
    "overexposed": 7
    "underexposed": 8
    "compression": 9

lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "query"
    - "key"
    - "value"
    - "dense"
    - "classifier"
  bias: "none"
  task_type: "SEQ_CLS"

training:
  output_dir: "checkpoints/vision_qc_lora"
  num_train_epochs: 50
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 50
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  mixed_precision: "fp16"
  use_8bit_adam: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  seed: 42

  # Constitutional settings
  deterministic: true
  replay_token_seed: 42
  save_every_n_steps: 100
  eval_every_n_steps: 25
  log_every_n_steps: 5

data:
  train_data: "data/processed/vision_qc_train.jsonl"
  val_data: "data/processed/vision_qc_val.jsonl"
  image_size: 224
  center_crop: true
  random_flip: false

categories:
  - "clean_render"
  - "noisy_render"
  - "banded_render"
  - "aliased_render"
  - "flickering_render"
  - "ghosted_render"
  - "blurred_render"
  - "overexposed_render"
  - "underexposed_render"
  - "compressed_render"

validation:
  test_images:
    - "data/test/clean_test.png"
    - "data/test/noisy_test.png"
    - "data/test/banded_test.png"
  confidence_threshold: 0.85
  seed: 42

constitutional:
  replay_validation: true
  rt4d_check: true
  deterministic_output: true
  metadata_embed: true
  trace_export: true
  reject_on_artifact: true
  max_artifact_score: 0.1

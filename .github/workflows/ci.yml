name: Mandala Rendering CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    # Blocking ESLint gate over first-party JS/ESM. `npm run lint` (eslint .)
    # exits non-zero on ERROR-level problems only (warnings do not fail the
    # build), so this job fails the pipeline exactly on genuine lint errors.
    # NOTE: this gate depends on branches #38 (eslint config) and #33
    # (RT4DGPURenderer.js parse-error fix). Until #33 lands, that single
    # remaining parse error keeps this job red; every other error is resolved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (blocking on errors)
        run: npm run lint

  test-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd mandala-rendering-software/mrs/packages/renderer-core
          npm ci
          
      - name: Render test surface
        run: |
          cd mandala-rendering-software/mrs/packages/renderer-core
          node src/cli.js render --surface tesseract --frames 5 --fps 30 --mode wireframe
          
      - name: Verify output
        run: |
          cd mandala-rendering-software/mrs/packages/renderer-core
          ls -la output/
          
  build-cmake:
    runs-on: ubuntu-latest
    needs: test-renderer
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up CMake
        uses: actions/setup-cmake@v3
        with:
          cmake-version: '3.20'
          
      - name: Build sme-suite with GCC
        run: |
          cd mandala-rendering-software/sme-suite
          mkdir -p build-gcc
          cd build-gcc
          cmake .. -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          cmake --build . --config Release
          
      - name: Verify build artifacts
        run: |
          ls -la sme-suite/build-gcc/modules/
  
  python-tests:
    runs-on: ubuntu-latest
    needs: test-renderer
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install pytest
          
      - name: Run Python tests
        run: |
          cd mandala-rendering-software
          python -m pytest aris/tests/ -v 2>/dev/null || echo "ARIS tests directory not found, checking structure..."
          ls aris/*.py | head -10


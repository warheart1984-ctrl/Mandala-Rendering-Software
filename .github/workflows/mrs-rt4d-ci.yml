name: MRS RT4D CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd mrs/packages/renderer-core && npm ci

      - name: Run RT4D test suite
        run: |
          node --test \
            mrs/packages/renderer-core/scripts/test/glb-importer.test.js \
            mrs/packages/renderer-core/scripts/test/render-still.test.js \
            mrs/packages/renderer-core/scripts/test/triangle-mesh.test.js \
            mrs/packages/renderer-core/scripts/test/glb-texture-decoder.test.js \
            mrs/packages/renderer-core/scripts/test/render-animation-glb.test.js

      - name: Smoke render from demo GLB
        run: |
          node mrs/packages/renderer-core/scripts/render-still.mjs \
            --glb mrs/demo/basic-scene.glb \
            --width 128 --height 128 --samples 4 --seed 42 \
            --output /tmp/smoke.png

      - name: Build Docker image
        run: docker build -f Dockerfile.mrs-rt4d -t mrs-rt4d .

      - name: Test Docker image
        run: |
          docker run --rm mrs-rt4d \
            node mrs/packages/renderer-core/scripts/render-still.mjs \
              --glb mrs/demo/basic-scene.glb \
              --width 64 --height 64 --samples 1 --seed 1 \
              --output /tmp/docker-smoke.png

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -f Dockerfile.mrs-rt4d -t ghcr.io/${{ github.repository }}/mrs-rt4d:latest .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}/mrs-rt4d:latest

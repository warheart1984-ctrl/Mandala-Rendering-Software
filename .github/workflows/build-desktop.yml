name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-cmd: npm run build:win
            artifact: mandala-windows
          - os: macos-latest
            build-cmd: npm run build:mac
            artifact: mandala-macos
          - os: ubuntu-latest
            build-cmd: npm run build:linux
            artifact: mandala-linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: mandala-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mandala-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.build-cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            mandala-app/dist/*.exe
            mandala-app/dist/*.dmg
            mandala-app/dist/*.zip
            mandala-app/dist/*.AppImage
            mandala-app/dist/*.deb
          if-no-files-found: error

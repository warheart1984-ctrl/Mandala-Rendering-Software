version: '3.9'

services:
  # 4D Rendering System (4DRS) — Browser host + CSSV dashboard
  app:
    build:
      context: .
      dockerfile: Dockerfile.4drs
    container_name: 4drs-hackathon
    ports:
      - "8080:8080"  # Browser host
      - "3000:3000"  # CSSV dashboard
    environment:
      NODE_ENV: production
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-your-mrs-assets-bucket}
      B2_REGION: ${B2_REGION:-us-west-004}
      B2_ENDPOINT: ${B2_ENDPOINT:-https://s3.us-west-004.backblazeb2.com}
      B2_FORCE_PATH_STYLE: ${B2_FORCE_PATH_STYLE:-true}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

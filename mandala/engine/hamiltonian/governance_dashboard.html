<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Governance Relaxation Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0e141b;
      --panel: #16202a;
      --ink: #e8eef4;
      --muted: #8aa0b5;
      --accent: #3d8fd1;
      --hot: #d4563a;
      --ok: #3cb371;
      --line: #243140;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
    header {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .hgov { font-size: 22px; font-variant-numeric: tabular-nums; }
    .delta { font-variant-numeric: tabular-nums; color: var(--muted); }
    .badge { padding: 3px 8px; border-radius: 999px; background: #1d3348; color: #9fd4ff; font-size: 11px; letter-spacing: .04em; }
    .badge.nightly { background: #1e3a2f; color: #8ee0b0; }
    button, select, input[type=number], input[type=text] {
      background: #0f1821; color: var(--ink); border: 1px solid #2a3d50; border-radius: 4px; padding: 5px 8px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: #2f74ad; color: #fff; }
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      grid-template-rows: 1fr 160px;
      height: calc(100% - 56px);
    }
    aside, main, .details, footer.tl {
      border-right: 1px solid var(--line);
      overflow: auto;
    }
    aside { padding: 10px; }
    .details { padding: 10px; border-right: none; }
    footer.tl { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 8px 12px; }
    label { display: block; color: var(--muted); margin: 8px 0 3px; font-size: 11px; text-transform: uppercase; }
    .filters span { display: inline-block; margin: 0 6px 4px 0; }
    .sliders { margin-top: 8px; }
    .sliders div { display: grid; grid-template-columns: 72px 1fr 36px; gap: 6px; align-items: center; margin: 3px 0; }
    svg#graph { width: 100%; height: calc(100% - 36px); background: #0b1117; }
    .tabs { display: flex; gap: 8px; padding: 6px 8px; }
    .tabs button[aria-pressed="true"] { background: #1d3a55; }
    .tooltip {
      position: absolute; pointer-events: none; background: #0b1117; border: 1px solid #345; padding: 6px 8px;
      border-radius: 4px; display: none; z-index: 5; max-width: 240px;
    }
    .bar { height: 8px; background: #223; border-radius: 4px; margin: 2px 0 8px; }
    .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    table.heat { border-collapse: collapse; font-size: 11px; }
    table.heat td, table.heat th { border: 1px solid #234; padding: 4px 6px; }
    .err { color: var(--hot); }
    .hist { font-variant-numeric: tabular-nums; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Governance Relaxation Dashboard</h1>
    <label style="margin:0">run
      <select id="runSel"><option value="">latest</option></select>
    </label>
    <button id="refreshBtn" type="button">Refresh</button>
    <span id="modeBadge" class="badge">LIVE</span>
    <div>
      <div class="hgov" id="hgov">H_gov —</div>
      <div class="delta" id="delta">Δ last run —</div>
    </div>
  </header>
  <div class="layout">
    <aside>
      <div class="filters" id="typeFilters"></div>
      <label>owner</label>
      <input id="ownerFilter" type="text" placeholder="any" />
      <label>tags</label>
      <input id="tagFilter" type="text" placeholder="comma tags" />
      <label>min local cost</label>
      <input id="minCost" type="number" step="0.01" value="0" />
      <label>last N runs</label>
      <input id="lastN" type="number" min="1" max="50" value="12" />
      <div class="sliders" id="alphaSliders"></div>
      <div class="sliders" id="wSliders"></div>
      <p>
        <button class="primary" id="applyBtn" type="button">Apply &amp; simulate</button>
        <button id="runBtn" type="button">Run relaxation now</button>
      </p>
      <p class="delta">In-memory only. Loopback. Auth omitted.</p>
    </aside>
    <main>
      <div class="tabs">
        <button type="button" id="tabGraph" aria-pressed="true">Graph</button>
        <button type="button" id="tabHeat" aria-pressed="false">Heatmap</button>
      </div>
      <svg id="graph" viewBox="0 0 640 480"></svg>
      <div id="heatWrap" style="display:none; padding:8px; overflow:auto"></div>
    </main>
    <section class="details" id="details">
      <h2 style="margin:0 0 8px; font-size:14px">Node</h2>
      <p class="delta">Click a node.</p>
    </section>
    <footer class="tl">
      <svg id="timeline" viewBox="0 0 1000 140" width="100%" height="140"></svg>
    </footer>
  </div>
  <div class="tooltip" id="tip"></div>
  <script>
    const DIMS = ["risk", "ambiguity", "evidence", "compliance", "trust", "jurisdiction"];
    const TYPES = ["decision", "intent", "actor", "policy", "tool"];
    const state = { graph: null, selected: null, tab: "graph", config: null };

    function $(id) { return document.getElementById(id); }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const data = await r.json();
      if (!r.ok) throw new Error((data.error && data.error.message) || r.statusText);
      return data;
    }

    function colorCost(t) {
      const u = Math.max(0, Math.min(1, t));
      const r = Math.round(40 + 180 * u);
      const g = Math.round(90 - 50 * u);
      const b = Math.round(200 - 160 * u);
      return `rgb(${r},${g},${b})`;
    }

    function setupFilters() {
      const box = $("typeFilters");
      box.innerHTML = "<label>type</label>";
      TYPES.forEach((t) => {
        const s = document.createElement("span");
        s.innerHTML = `<label style="display:inline;text-transform:none"><input type="checkbox" data-type="${t}" checked /> ${t}</label>`;
        box.appendChild(s);
      });
      function sliders(el, prefix) {
        el.innerHTML = `<label>${prefix}</label>`;
        DIMS.forEach((d) => {
          const row = document.createElement("div");
          row.innerHTML = `<span>${d.slice(0, 4)}</span><input type="range" min="0" max="2" step="0.05" value="1" data-${prefix}="${d}" /><span class="v">1.00</span>`;
          el.appendChild(row);
          row.querySelector("input").addEventListener("input", (ev) => {
            row.querySelector(".v").textContent = Number(ev.target.value).toFixed(2);
          });
        });
      }
      sliders($("alphaSliders"), "alpha");
      sliders($("wSliders"), "w");
    }

    function readWeights(prefix) {
      const o = {};
      document.querySelectorAll(`[data-${prefix}]`).forEach((el) => { o[el.getAttribute(`data-${prefix}`)] = Number(el.value); });
      return o;
    }

    function applyConfigToSliders(cfg) {
      if (!cfg) return;
      DIMS.forEach((d) => {
        const a = document.querySelector(`[data-alpha="${d}"]`);
        const w = document.querySelector(`[data-w="${d}"]`);
        if (a && cfg.alpha) { a.value = cfg.alpha[d]; a.parentElement.querySelector(".v").textContent = Number(cfg.alpha[d]).toFixed(2); }
        if (w && cfg.w) { w.value = cfg.w[d]; w.parentElement.querySelector(".v").textContent = Number(cfg.w[d]).toFixed(2); }
      });
    }

    function visibleNodes(graph) {
      const allowed = new Set([...document.querySelectorAll("[data-type]:checked")].map((x) => x.dataset.type));
      const owner = $("ownerFilter").value.trim().toLowerCase();
      const tags = $("tagFilter").value.split(",").map((s) => s.trim()).filter(Boolean);
      const minC = Number($("minCost").value || 0);
      return graph.nodes.filter((n) => {
        if (!allowed.has(n.type)) return false;
        if (owner && String((n.metadata && n.metadata.owner) || "").toLowerCase() !== owner) return false;
        if (tags.length) {
          const have = n.metadata && n.metadata.tags || [];
          if (!tags.every((t) => have.includes(t))) return false;
        }
        if ((n.local_cost || 0) < minC) return false;
        return true;
      });
    }

    function layout(nodes) {
      const cx = 320, cy = 240, R = 170;
      return nodes.map((n, i) => {
        const th = (2 * Math.PI * i) / Math.max(nodes.length, 1) - Math.PI / 2;
        return { ...n, x: cx + R * Math.cos(th), y: cy + R * Math.sin(th) };
      });
    }

    function drawGraph(graph) {
      const svg = $("graph");
      const nodes = layout(visibleNodes(graph));
      const idset = new Set(nodes.map((n) => n.id));
      const maxC = Math.max(...graph.nodes.map((n) => n.local_cost || 0), 1e-9);
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const edges = graph.edges.filter((e) => idset.has(e.source) && idset.has(e.target));
      let html = "";
      edges.forEach((e) => {
        const a = pos[e.source], b = pos[e.target];
        const w = 1 + 4 * Math.min(e.coupling || 1, 2);
        html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3a5166" stroke-width="${w}" />`;
      });
      nodes.forEach((n) => {
        const r = 8 + 16 * (n.coordinates.risk || 0);
        const fill = colorCost((n.local_cost || 0) / maxC);
        html += `<g data-id="${n.id}" class="n">
          <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}" stroke="${state.selected === n.id ? "#fff" : "#0b1117"}" stroke-width="2" />
          <text x="${n.x}" y="${n.y + r + 12}" fill="#cfe" font-size="10" text-anchor="middle">${(n.label || n.id).slice(0, 22)}</text>
        </g>`;
      });
      svg.innerHTML = html;
      svg.querySelectorAll("g.n").forEach((g) => {
        g.addEventListener("mouseenter", (ev) => showTip(ev, graph.nodes.find((x) => x.id === g.dataset.id)));
        g.addEventListener("mouseleave", hideTip);
        g.addEventListener("click", () => selectNode(g.dataset.id));
      });
    }

    function drawHeat(graph) {
      const nodes = visibleNodes(graph);
      const owners = [...new Set(nodes.map((n) => (n.metadata && n.metadata.owner) || "—"))];
      let html = "<table class='heat'><tr><th>owner</th>";
      DIMS.forEach((d) => { html += `<th>${d.slice(0, 4)}</th>`; });
      html += "<th>H_i</th></tr>";
      owners.forEach((own) => {
        const group = nodes.filter((n) => ((n.metadata && n.metadata.owner) || "—") === own);
        const avg = (k) => group.reduce((s, n) => s + (n.coordinates[k] || 0), 0) / Math.max(group.length, 1);
        html += `<tr><td>${own}</td>`;
        DIMS.forEach((d) => {
          const v = avg(d);
          html += `<td style="background:${colorCost(v)}">${v.toFixed(2)}</td>`;
        });
        const hi = group.reduce((s, n) => s + (n.local_cost || 0), 0) / Math.max(group.length, 1);
        html += `<td>${hi.toFixed(3)}</td></tr>`;
      });
      html += "</table><p class='delta'>Rows = owner, cols = dimensions (mean of visible nodes). Status: partial.</p>";
      $("heatWrap").innerHTML = html;
    }

    function showTip(ev, n) {
      const tip = $("tip");
      tip.style.display = "block";
      tip.style.left = (ev.pageX + 12) + "px";
      tip.style.top = (ev.pageY + 12) + "px";
      tip.innerHTML = `<b>${n.label || n.id}</b><br/>${n.type} · H_i=${(n.local_cost || 0).toFixed(4)}<br/>risk=${n.coordinates.risk.toFixed(2)}`;
    }
    function hideTip() { $("tip").style.display = "none"; }

    async function selectNode(id) {
      state.selected = id;
      const n = await api("/api/governance/node/" + encodeURIComponent(id));
      const hist = await api("/api/governance/history/" + encodeURIComponent(id));
      const bars = DIMS.map((d) => {
        const v = n.coordinates[d] || 0;
        return `<label>${d}</label><div class="bar"><i style="width:${(v * 100).toFixed(0)}%"></i></div>`;
      }).join("");
      const hrows = (hist.history || []).slice(-12).reverse().map((h) =>
        `<div class="hist">${h.run_id} · ${h.timestamp} · H_i=${Number(h.local_cost).toFixed(4)}</div>`
      ).join("") || "<div class='delta'>No relax runs yet.</div>";
      $("details").innerHTML = `<h2 style="margin:0 0 8px;font-size:14px">${n.label || n.id}</h2>
        <p>${n.type} · ${n.metadata.owner} · local_cost ${Number(n.local_cost).toFixed(4)}</p>
        <p class="delta">${(n.neighbors || []).join(", ") || "no neighbors"}</p>
        ${bars}
        <h3 style="font-size:12px">history</h3>${hrows}`;
      if (state.graph) drawGraph(state.graph);
    }

    function drawTimeline(graph) {
      const svg = $("timeline");
      const lastN = Number($("lastN").value || 12);
      const runs = (graph.runs || []).slice(-lastN);
      const series = [];
      if (runs.length) {
        series.push(runs[0].before_cost);
        runs.forEach((r) => series.push(r.after_cost));
      } else {
        series.push(graph.global_cost);
      }
      const w = 1000, h = 140, pad = 24;
      const min = Math.min(...series), max = Math.max(...series);
      const span = (max - min) || 1;
      const x = (i) => pad + (i * (w - 2 * pad)) / Math.max(series.length - 1, 1);
      const y = (v) => h - pad - ((v - min) / span) * (h - 2 * pad);
      let d = "";
      series.forEach((v, i) => { d += (i ? "L" : "M") + x(i) + "," + y(v) + " "; });
      let marks = "";
      for (let i = 1; i < series.length; i++) {
        const dH = series[i] - series[i - 1];
        if (Math.abs(dH) >= (graph.config && graph.config.phase_abs_drop || 0.25)) {
          marks += `<circle cx="${x(i)}" cy="${y(series[i])}" r="5" fill="#d4563a"><title>phase-transition analogue |ΔH|=${dH.toFixed(3)}</title></circle>`;
        }
      }
      svg.innerHTML = `<text x="8" y="16" fill="#8aa0b5" font-size="11">H_gov vs pass (red = |ΔH| analogue flag, not a proven critical point)</text>
        <path d="${d}" fill="none" stroke="#3d8fd1" stroke-width="2" />${marks}`;
    }

    async function load() {
      const graph = await api("/api/governance/graph");
      state.graph = graph;
      state.config = graph.config;
      applyConfigToSliders(graph.config);
      $("hgov").textContent = "H_gov " + Number(graph.global_cost).toFixed(4);
      const last = (graph.runs || [])[graph.runs.length - 1];
      $("delta").textContent = last ? (`Δ ${Number(last.deltaH).toFixed(4)} · ${last.run_id}`) : "Δ last run —";
      const badge = $("modeBadge");
      if (last && last.mode === "nightly") { badge.textContent = "NIGHTLY"; badge.className = "badge nightly"; }
      else { badge.textContent = last ? "LIVE" : "LIVE"; badge.className = "badge"; }
      const sel = $("runSel");
      const cur = sel.value;
      sel.innerHTML = `<option value="">latest</option>` + (graph.runs || []).map((r) =>
        `<option value="${r.run_id}">${r.run_id}</option>`).join("");
      if (cur) sel.value = cur;
      if (state.tab === "graph") drawGraph(graph);
      else drawHeat(graph);
      drawTimeline(graph);
    }

    setupFilters();
    $("refreshBtn").onclick = () => load().catch((e) => { $("hgov").textContent = e.message; });
    $("tabGraph").onclick = () => {
      state.tab = "graph"; $("tabGraph").setAttribute("aria-pressed", "true"); $("tabHeat").setAttribute("aria-pressed", "false");
      $("graph").style.display = ""; $("heatWrap").style.display = "none"; if (state.graph) drawGraph(state.graph);
    };
    $("tabHeat").onclick = () => {
      state.tab = "heat"; $("tabHeat").setAttribute("aria-pressed", "true"); $("tabGraph").setAttribute("aria-pressed", "false");
      $("graph").style.display = "none"; $("heatWrap").style.display = "block"; if (state.graph) drawHeat(state.graph);
    };
    $("applyBtn").onclick = async () => {
      await api("/api/governance/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alpha: readWeights("alpha"), w: readWeights("w") }),
      });
      await load();
    };
    $("runBtn").onclick = async () => {
      await api("/api/governance/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alpha: readWeights("alpha"), w: readWeights("w") }),
      });
      await api("/api/governance/relax", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "nightly", max_iterations: 1 }),
      });
      await load();
      if (state.selected) selectNode(state.selected);
    };
    ["ownerFilter", "tagFilter", "minCost", "lastN"].forEach((id) => {
      $(id).addEventListener("input", () => { if (state.graph) { drawGraph(state.graph); drawHeat(state.graph); drawTimeline(state.graph); } });
    });
    $("typeFilters").addEventListener("change", () => { if (state.graph) { drawGraph(state.graph); drawHeat(state.graph); } });
    load().catch((e) => { $("hgov").textContent = e.message; });
  </script>
</body>
</html>

[project]
name = "sme-txt"
version = "1.0.0"
description = "Sovereign Multimodal Engine — Text Reasoning Core (LLM)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sme_txt*"]

[project.optional-dependencies]
llama-cpp = ["llama-cpp-python>=0.2.90"]
ort = ["onnxruntime>=1.17", "onnx>=1.15"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "T20", "ARG", "PL", "TRY", "PD", "PGH", "PIE", "TCH", "FLY", "NPY", "BLE", "PERF", "RSE", "RET", "PTH", "ERA", "EXE", "ISC", "ICN", "LOG", "G", "INP", "COM", "TRY", "TID", "Q", "RUF", "ASYNC", "SLF", "SLOT", "SUB", "UNUSED"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
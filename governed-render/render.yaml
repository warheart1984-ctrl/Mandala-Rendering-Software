# Render Blueprint for governed-render API (Docker runtime with ffmpeg).
# Context = repo root; Dockerfile lives at governed-render/Dockerfile.
services:
  - type: web
    name: governed-render
    runtime: docker
    region: oregon
    plan: free
    rootDir: governed-render
    dockerfilePath: ./Dockerfile
    dockerContext: ..
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: GOVERNED_RENDER_KEYS
        sync: false
        comment: JSON array like [{"key":"demo-0001","tier":"trial"}]

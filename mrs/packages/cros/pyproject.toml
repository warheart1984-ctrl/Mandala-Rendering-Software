[project]
name = "mrs-cros"
version = "0.1.0"
description = "CROS — Cinematic Render Operating System: reference architecture (constitution, lineage artifact schemas, adapter contract, conformance profiles). Scaffold — not a renderer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cros"]

# constitution/, schemas/ and profiles/ are resolved repo-relative at runtime
# (see src/cros/resources.py). Shipping them as package data is a tracked
# follow-up, not a current capability.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

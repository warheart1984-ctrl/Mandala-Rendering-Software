[project]
name = "mrs-infinity-director"
version = "0.1.0"
description = "CPU-only director router for Infinity memoryboard -> MRS native render lanes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-dotenv==1.2.2",
  "pydantic==2.11.7",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

# The service code lives in the `app` package. Scope discovery to it so an
# editable install (`pip install -e .`) does not fail on the flat layout,
# where setuptools otherwise sees multiple top-level dirs (app, schemas) and
# refuses to guess. schemas/, scripts/, docs/, and tests/ are not packaged.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

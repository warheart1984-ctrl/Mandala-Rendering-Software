# Render Blueprint — free web service for MRS Genblaze Media MVP
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mrs-genblaze-media
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Root Dir in Render dashboard should be: mrs/apps/genblaze-media
    # Or deploy from that directory.
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: GENBLAZE_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      # Judge demo: FLUX stills only. Opt in with "1" when Cosmos is live on the key.
      - key: GENBLAZE_VIDEO_ENABLED
        value: "0"
      - key: GENBLAZE_STORAGE_PREFIX
        value: genblaze-media
      # RT4D renderer backend. These take effect only when the service builds
      # the repo-root Dockerfile with a repo-root context (Root Directory
      # empty): the app-local Dockerfile above cannot reach
      # mrs/packages/renderer-core and reports rt4d.available=false.
      # Off by default; NVIDIA FLUX stays the primary image backend.
      - key: GENBLAZE_IMAGE_FALLBACK_TO_RT4D
        value: "0"
      # Free plan is a shared 0.1 CPU, so keep the CPU path trace small enough
      # to finish inside the platform request timeout. Raise after measuring.
      - key: RT4D_RENDER_WIDTH
        value: "256"
      - key: RT4D_RENDER_HEIGHT
        value: "256"
      - key: RT4D_SAMPLES
        value: "8"
      - key: RT4D_TIMEOUT
        value: "120"
      - key: GENBLAZE_HTTP_TIMEOUT
        value: "600"
      - key: GENBLAZE_NVCF_TIMEOUT
        value: "600"
      - key: GENBLAZE_PIPELINE_TIMEOUT
        value: "720"
      # NVIDIA documents 300 as the NVCF-POLL-SECONDS maximum. Render plus a
      # cold NIM otherwise risks returning an empty gateway 504 before 202.
      - key: GENBLAZE_NVCF_POLL_SECONDS
        value: "300"
      # Default off: do not auto-retry empty NVIDIA 504s (billing ambiguity).
      - key: GENBLAZE_EMPTY_504_RETRY
        value: "0"
      # Invalid-payload probe at boot. If this also returns 504, /health marks
      # the NIM unavailable; the probe did not successfully warm the model.
      - key: GENBLAZE_NVIDIA_WARMUP_ON_STARTUP
        value: "1"
      # Default off: Render healthCheckPath=/health must not ListObjects (Class C).
      - key: B2_PROBE_ON_HEALTH
        value: "0"

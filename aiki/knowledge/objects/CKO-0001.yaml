pedagogy:
  learning_objectives:
    - "Explain why LLM evaluation is hard (open-ended outputs, shifting tasks, contested 'goodness')."
    - "Differentiate intrinsic vs extrinsic evaluation and when each is appropriate."
    - "Name failure modes of leaderboards and demo-driven claims."
    - "Apply a practical evaluation checklist to a real project decision."
  prerequisites:
    - "Basic understanding of LLMs (prompt → completion)"
    - "Familiarity with the idea of a benchmark or test set"
  key_questions:
    - "How do we know an LLM is 'good'?"
    - "What does a high benchmark score actually measure?"
    - "When should we trust extrinsic (task) evaluation over intrinsic scores?"
  narrative_arc:
    hook: "Everyone says their model is better—how do we actually know?"
    sections:
      - id: context
        label: "Why evaluation matters"
        beats:
          - "Product and research decisions hang on evaluation claims."
          - "Vague 'SOTA' language hides measurement choices."
      - id: methods
        label: "Common evaluation approaches"
        beats:
          - "Intrinsic: benchmarks, preference judgments, automated metrics."
          - "Extrinsic: downstream task success, human workflow outcomes."
      - id: limits
        label: "Where evaluations fail"
        beats:
          - "Contamination, saturation, and gaming."
          - "Wrong proxy for the real user job."
      - id: practice
        label: "How to think about evaluation in real projects"
        beats:
          - "Define the job-to-be-done before picking metrics."
          - "Combine cheap intrinsic screens with targeted extrinsic checks."
    takeaway: "Evaluation is a design choice—measure what the decision needs, not what is convenient."
content_core:
  definitions:
    - term: "Intrinsic evaluation"
      explanation: "Measures model behavior directly on tasks or benchmarks (e.g., accuracy on a held-out set, preference win rate)."
    - term: "Extrinsic evaluation"
      explanation: "Measures usefulness in a downstream application or human workflow (e.g., tickets resolved, time-to-edit)."
    - term: "Leaderboard claim"
      explanation: "A ranked comparison that is only as meaningful as the benchmark's coverage, contamination controls, and relevance to your use case."
    - term: "Contamination"
      explanation: "When evaluation items (or close paraphrases) appear in training data, inflating scores without true generalization."
  examples:
    - "Comparing two chatbots on MMLU-style knowledge items (intrinsic) vs measuring support-ticket resolution rate (extrinsic)."
    - "A demo that looks fluent but fails a small set of domain-critical questions."
    - "Two models tie on a saturated benchmark but diverge on a private domain suite."
  analogies:
    - "Evaluating a student by standardized test scores vs. performance in a real internship."
    - "Car ads quoting 0–60 times vs. reliability on your daily commute."
  misconceptions:
    - "Higher leaderboard rank always means a better product model."
    - "One number can summarize all LLM quality."
  references:
    - type: paper
      title: "Holistic Evaluation of Language Models (HELM)"
      link: "https://crfm.stanford.edu/helm/"
    - type: paper
      title: "Measuring Massive Multitask Language Understanding (MMLU)"
      link: "https://arxiv.org/abs/2009.03300"

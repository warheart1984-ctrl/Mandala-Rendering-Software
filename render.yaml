# Render Blueprint — Genblaze media (hackathon App URL)
# https://render.com/docs/blueprint-spec
#
# Dashboard equivalent:
#   Dockerfile Path: ./Dockerfile
#   Root Directory: (empty — repo root)
#   Health Check: /health
services:
  - type: web
    name: mandala-rendering-system-mrs
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: GENBLAZE_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      - key: GENBLAZE_STORAGE_PREFIX
        value: genblaze-media
      - key: GENBLAZE_HTTP_TIMEOUT
        value: "600"
      - key: GENBLAZE_NVCF_TIMEOUT
        value: "600"
      - key: GENBLAZE_PIPELINE_TIMEOUT
        value: "720"
      # NVIDIA documents 300 as the NVCF-POLL-SECONDS maximum. Render plus a
      # cold NIM otherwise risks returning an empty gateway 504 before 202.
      - key: GENBLAZE_NVCF_POLL_SECONDS
        value: "300"
      # Default off: do not auto-retry empty NVIDIA 504s (billing ambiguity).
      - key: GENBLAZE_EMPTY_504_RETRY
        value: "0"
      # If this invalid-payload probe also gets 504, /health reports the NIM
      # unavailable; the probe did not successfully warm the model.
      - key: GENBLAZE_NVIDIA_WARMUP_ON_STARTUP
        value: "1"
      # When NVIDIA NIM returns 504/unavailable, fall back to MRS RT4D stills
      # (requires repo-root Dockerfile so rt4d.available=true).
      - key: GENBLAZE_IMAGE_FALLBACK_TO_RT4D
        value: "1"
      # NIM FLUX has been returning gateway 504s, so stills are served by the
      # deterministic RT4D path tracer instead. This is a seeded procedural 4D
      # render, not text-to-image. Remove this key to return to NVIDIA primary;
      # the fallback above stays armed for that case.
      - key: GENBLAZE_IMAGE_BACKEND
        value: rt4d

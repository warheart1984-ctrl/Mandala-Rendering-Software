# Exported from Render on 2026-08-16T14:18:25Z
version: "1"
projects:
- name: MRS
  environments:
  - name: Production
    services:
    - type: web
      name: Mandala-Rendering-System-MRS-
      runtime: docker
      repo: https://github.com/warheart1984-ctrl/Mandala-Rendering-System-MRS-
      plan: free
      envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: GENBLAZE_IMAGE_FALLBACK_TO_RT4D
        sync: false
      - key: GENBLAZE_IMAGE_BACKEND
        sync: false
      - key: NVIDIA_EMBED_URL
        sync: false
      - key: NVIDIA_EMBED_MODEL
        sync: false
      - key: GENBLAZE_IMAGE_MODEL
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NGC_API_KEY
        sync: false
      - key: B2_FORCE_PATH_STYLE
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_KEY_ID
        sync: false
      region: ohio
      healthCheckPath: /health
      dockerContext: .
      dockerfilePath: ./Dockerfile
      autoDeployTrigger: "off"
    - type: web
      name: mrs-rt4d-engine
      runtime: node
      repo: https://github.com/warheart1984-ctrl/Mandala-Rendering-System-MRS-
      plan: free
      envVars:
      - key: MRS_PRINT_TIMEOUT_SECONDS
        sync: false
      - key: PRINTER_PIPELINE_SCRIPT
        sync: false
      - key: PRINTER_API_ENABLED
        sync: false
      - key: B2_PROBE_ON_HEALTH
        value: "0"
      - key: PROMPT_SCENE_EXPAND_WORLD
        value: "0"
      - key: ENGINE3D_EXPAND_SCRIPT
        value: /app/engine3d-core/scripts/expand-world-document.mjs
      - key: PROMPT_SCENE_BRIDGE_SCRIPT
        value: /app/prompt-scene-bridge/run_bridge.py
      - key: RT4D_TIMEOUT
        value: "180"
      - key: RT4D_SAMPLES
        value: "6"
      - key: RT4D_RENDER_HEIGHT
        value: "256"
      - key: RT4D_RENDER_WIDTH
        value: "256"
      - key: RT4D_ALLOW_HEAVY
        value: "0"
      - key: GENBLAZE_VIDEO_ENABLED
        value: "0"
      - key: GENBLAZE_IMAGE_BACKEND
        value: "rt4d"
      - key: GENBLAZE_IMAGE_FALLBACK_TO_RT4D
        value: "1"
      - key: GENBLAZE_NVIDIA_WARMUP_ON_STARTUP
        value: "1"
      - key: GENBLAZE_EMPTY_504_RETRY
        value: "0"
      - key: GENBLAZE_NVCF_POLL_SECONDS
        value: "300"
      - key: GENBLAZE_PIPELINE_TIMEOUT
        value: "720"
      - key: GENBLAZE_NVCF_TIMEOUT
        value: "600"
      - key: GENBLAZE_HTTP_TIMEOUT
        value: "600"
      - key: GENBLAZE_STORAGE_PREFIX
        value: genblaze-media
      - key: GENBLAZE_ALLOW_BYOK
        value: "0"
      - key: GENBLAZE_IMAGE_MODEL
        sync: false
      region: oregon
      buildCommand: corepack enable && pnpm install --frozen-lockfile
      startCommand: pnpm --filter @mrs/rt4d-engine start
      healthCheckPath: /health
      autoDeployTrigger: commit
      rootDir: mrs